# Routine updates preserve the supported compatibility lines.
# Major upgrades are deliberate; security updates retain their separate policy.

version: 2

updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      maven-production:
        dependency-type: production
        update-types: [minor, patch]
      maven-development:
        dependency-type: development
        update-types: [minor, patch]
    labels: [dependencies]
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    open-pull-requests-limit: 2

  - package-ecosystem: npm
    directory: /tools
    schedule:
      interval: weekly
      day: monday
    groups:
      npm-tools:
        patterns: ["*"]
        update-types: [minor, patch]
    labels: [dependencies]
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    open-pull-requests-limit: 2
    versioning-strategy: increase-if-necessary

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]
    labels: [dependencies, ci]
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    open-pull-requests-limit: 2
